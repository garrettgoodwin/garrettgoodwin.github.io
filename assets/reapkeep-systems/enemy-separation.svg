<text x="829" y="323" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">Refresh neighbors when the query is due</text>
<text x="829" y="362" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">OverlapCircleNonAlloc → reuse the collider buffer.</text>
<text x="829" y="394" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Exclude self and duplicate owners.</text>
<text x="829" y="426" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Keep the results in a bounded neighbor cache.</text>
<path d="M1172 473 L1172 542" fill="none" stroke="#74bfd1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1196" y="514" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#74bfd1">reuse cached candidates</text>
<rect x="805" y="542" width="735" height="316" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="829" y="585" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">Evaluate movement each physics step</text>
<text x="830" y="635" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#b9c1cd">Follow / dash</text>
<text x="1055" y="635" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b9c1cd">Calculate the base movement velocity.</text>
<text x="830" y="696" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#f05a93">Soft separation</text>
<text x="1055" y="696" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b9c1cd">Add smoothed steering with a speed cap.</text>
<text x="830" y="757" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#efb26d">Deep overlap</text>
<text x="1055" y="757" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b9c1cd">Remove inward motion; add outward escape.</text>
<text x="830" y="818" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#b9c1cd">Rigidbody2D</text>
<text x="1055" y="818" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b9c1cd">Apply the resolved movement.</text>
<text x="60" y="905" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">The circles are schematic. Desired spacing depends on collider size.</text>
<path d="M60 944 L1540 944" fill="none" stroke="#3b4452" stroke-width="1" stroke-linejoin="round"/>
<text x="60" y="995" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#f2f3f5">0.05 s</text>
<text x="60" y="1036" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b9c1cd">Source-default query interval</text>
<text x="595" y="995" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#f2f3f5">16 collider slots</text>
<text x="595" y="1036" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b9c1cd">Source-default query buffer</text>
<text x="1130" y="995" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="700" text-anchor="start" fill="#f2f3f5">Staggered start</text>
<text x="1130" y="1036" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#b9c1cd">Queries offset on pool spawn</text>
<text x="60" y="1088" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#f2f3f5">The performance technique is reusing and spacing out queries; separation controls how the crowd moves.</text>
<path d="M60 1128 L1540 1128" fill="none" stroke="#3b4452" stroke-width="1" stroke-linejoin="round"/>
<text x="60" y="1156" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">Code: EnemySeparation.SampleCrowd / RefreshNeighborCache / ResolveMovementVelocity; FollowPlayerMovement; EnemyMovementController.</text>
<text x="60" y="1184" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#b9c1cd">Defaults shown are script values; Inspector/prefab settings may differ. Neighbor evaluation still runs between query refreshes.</text></svg>
