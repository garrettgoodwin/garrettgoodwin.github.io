<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="888" viewBox="32 224 1536 888" role="img" aria-labelledby="title desc"><title id="title">Enemy movement with a local crowd query</title><desc id="desc">EnemyMovementController reuses follow and dash movement behaviors. EnemySeparation periodically refreshes a non-allocating collider query, filters self and duplicate owners, and retains a bounded cache. Each movement evaluation uses cached neighbors to add capped soft steering, then a separate hard-overlap escape correction. A conceptual neighborhood diagram shows the search radius, desired spacing, and deep-overlap threshold.</desc><defs>
<marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f05a93"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74bfd1"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b9c1cd"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#efb26d"/></marker>
</defs><rect width="1600" height="1200" fill="#0b0d12"/>
<text x="60" y="64" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#f05a93">REAPKEEP / CORE SYSTEMS</text>
<text x="1540" y="64" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#b9c1cd">03 / 04</text>
<text x="60" y="139" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" text-anchor="start" fill="#f2f3f5">Enemy movement with a local crowd query</text>
<text x="60" y="188" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#b9c1cd">Cached neighbor checks feed soft steering and a separate correction for deep overlap.</text>
<text x="60" y="256" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#b9c1cd">NEIGHBORHOOD VIEW</text>
