<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="888" viewBox="32 224 1536 888" role="img" aria-labelledby="title desc"><title id="title">XP gems: manage value and object count</title><desc id="desc">EnemyDeathHandler limits the physical gem count while passing total reward value to XPPickupManager. At a cap or frame budget, the manager tries adding value to a collectible gem; otherwise it attempts a pooled spawn. Policy components handle spawning, condensing, offscreen pulling and movement. Collection awards PlayerXP and returns configured pooled gems for reuse. Merging transfers donor value to a target before releasing the donor.</desc><defs>
<marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f05a93"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74bfd1"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b9c1cd"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#efb26d"/></marker>
</defs><rect width="1600" height="1200" fill="#0b0d12"/>
<text x="60" y="64" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#f05a93">REAPKEEP / CORE SYSTEMS</text>
<text x="1540" y="64" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#b9c1cd">04 / 04</text>
<text x="60" y="139" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" text-anchor="start" fill="#f2f3f5">XP gems: manage value and object count</text>
<text x="60" y="188" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#b9c1cd">The XP manager coordinates drops, merging, offscreen movement, and collection.</text>
<rect x="60" y="245" width="910" height="135" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="84" y="285" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">Enemy death → total XP reward</text>
<text x="84" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">EnemyDeathHandler passes total XP and a limited physical drop count.</text>
<path d="M515 380 L515 445" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<text x="540" y="420" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">reward values</text>
<rect x="60" y="445" width="910" height="174" rx="7" fill="#20171f" stroke="#f05a93" stroke-width="1.3"/>
<text x="84" y="485" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">XPPickupManager splits and routes XP</text>
<text x="84" y="524" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">When a cap or frame budget is reached, try adding XP to a collectible gem.</text>
<text x="84" y="556" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Otherwise, attempt a pooled spawn.</text>
<path d="M290 619 L290 709" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<text x="85" y="668" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">spawn attempt</text>
<path d="M760 619 L760 709" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<text x="785" y="668" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">route succeeds</text>
<rect x="60" y="709" width="410" height="158" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="84" y="749" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">New gem</text>
<text x="84" y="788" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Spawn policy → XP pool.</text>
<text x="84" y="820" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Prepare value before enable.</text>
<rect x="560" y="709" width="410" height="158" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="584" y="749" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">Existing gem</text>
<text x="584" y="788" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">AddValue stores more XP.</text>
<text x="584" y="820" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Refresh the visual tier.</text>
<path d="M265 867 L265 938 L515 938 L515 981" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<path d="M765 867 L765 938 L515 938" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round"/>
<text x="282" y="916" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">collect through player contact</text>
<rect x="170" y="981" width="690" height="116" rx="7" fill="#20171f" stroke="#f05a93" stroke-width="1.3"/>
<text x="194" y="1021" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">Collection → PlayerXP.AddXP</text>
<text x="194" y="1060" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Consume the pickup and return it through its pool link.</text>
<rect x="1055" y="245" width="485" height="852" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="1080" y="289" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">Supporting systems</text>
<text x="1080" y="339" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#f05a93">Condense policy</text>
<text x="1080" y="379" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Transfer donor XP to a target, then</text>
<text x="1080" y="411" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">return the donor to the pool.</text>
<path d="M1120 470L1137.28 494L1120 518L1102.72 494Z" fill="#f05a93"/>
<path d="M1190 470L1207.28 494L1190 518L1172.72 494Z" fill="#f05a93"/>
<path d="M1230 494 L1340 494" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<path d="M1400 458L1425.92 494L1400 530L1374.08 494Z" fill="#f05a93"/>
<text x="1080" y="551" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#f2f3f5">Same total XP; fewer live objects.</text>
<path d="M1080 578 L1515 578" fill="none" stroke="#3b4452" stroke-width="1" stroke-linejoin="round"/>
<text x="1080" y="621" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#f05a93">Offscreen pull + movement</text>
<text x="1080" y="661" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Process a limited batch each tick. Skip</text>
<text x="1080" y="693" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">gems already under magnet</text>
<text x="1080" y="725" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">attraction.</text>
<path d="M1080 774 L1515 774" fill="none" stroke="#3b4452" stroke-width="1" stroke-linejoin="round"/>
<text x="1080" y="817" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#f05a93">Pooled pickup lifecycle</text>
<text x="1080" y="857" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">XPPickupPool uses</text>
<text x="1080" y="889" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">BasePool&lt;XPPickup&gt;. Returned</text>
<text x="1080" y="921" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">objects can be prepared for another</text>
<text x="1080" y="953" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">drop.</text>
<text x="1080" y="1027" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#f2f3f5">Policies share a manager context.</text>
<path d="M60 1128 L1540 1128" fill="none" stroke="#3b4452" stroke-width="1" stroke-linejoin="round"/>
<text x="60" y="1156" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">Code: EnemyDeathHandler.DropXP; XPPickupManager; DefaultGemSpawnPolicy / DefaultGemCondensePolicy; XPPickup; PlayerXP.</text>
<text x="60" y="1184" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#b9c1cd">Routing needs an eligible gem. Thresholds, merge rules, and movement budgets are configurable; the collection path shown uses a pool link.</text></svg>
