<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="888" viewBox="32 224 1536 888" role="img" aria-labelledby="title desc"><title id="title">Object pooling: reuse with a clean reset</title><desc id="desc">EnemyPool reuses inactive instances grouped by prefab. It configures visuals, transform, and optional stat overrides before activation, then runs stat initialization before other pool callbacks. Despawn callbacks run before deactivation and return to the inactive stack. Growth obeys a frame creation budget and optional hard caps. XPPickupPool separately derives from BasePool and prepares value before activating a gem.</desc><defs>
<marker id="pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f05a93"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74bfd1"/></marker>
<marker id="muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b9c1cd"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#efb26d"/></marker>
</defs><rect width="1600" height="1200" fill="#0b0d12"/>
<text x="60" y="64" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#f05a93">REAPKEEP / CORE SYSTEMS</text>
<text x="1540" y="64" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" text-anchor="end" fill="#b9c1cd">02 / 04</text>
<text x="60" y="139" font-family="DejaVu Sans, sans-serif" font-size="46" font-weight="700" text-anchor="start" fill="#f2f3f5">Object pooling: reuse with a clean reset</text>
<text x="60" y="188" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#b9c1cd">Reusing an object also means restoring the state needed for its next lifetime.</text>
<rect x="60" y="245" width="335" height="169" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="84" y="285" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">1. Spawn request</text>
<text x="84" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Prefab, world position,</text>
<text x="84" y="356" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">and optional stat override</text>
<rect x="505" y="245" width="440" height="169" rx="7" fill="#20171f" stroke="#f05a93" stroke-width="1.3"/>
<text x="529" y="285" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">2. Take an inactive object</text>
<text x="529" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Pop from the prefab’s stack.</text>
<text x="529" y="356" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">If empty, check growth limits.</text>
<rect x="1065" y="245" width="475" height="169" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="1089" y="285" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">3. Configure before enable</text>
<text x="1089" y="324" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Restore visuals and transform.</text>
<text x="1089" y="356" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Apply the new stat override.</text>
<path d="M395 328 L505 328" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<path d="M945 328 L1065 328" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<text x="60" y="453" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">A configured hard cap or exhausted creation budget can</text>
<text x="60" y="478" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">decline a spawn.</text>
<path d="M1302 414 L1302 600" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<text x="1325" y="498" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">configured</text>
<text x="1325" y="523" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">instance</text>
<rect x="835" y="600" width="705" height="181" rx="7" fill="#20171f" stroke="#f05a93" stroke-width="1.3"/>
<text x="859" y="640" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">4. Activate + initialize</text>
<text x="859" y="679" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Enable the GameObject, then invoke spawn callbacks.</text>
<text x="859" y="711" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">EnemyStats initializes before the other callbacks.</text>
<rect x="60" y="600" width="485" height="181" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="84" y="640" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">5. Return for reuse</text>
<text x="84" y="679" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Run despawn callbacks, then disable.</text>
<text x="84" y="711" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#b9c1cd">Push back onto the inactive stack.</text>
<path d="M835 691 L545 691" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<text x="601" y="662" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">death / despawn</text>
<path d="M302 600 L302 530 L725 530 L725 414" fill="none" stroke="#74bfd1" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="394" y="512" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#74bfd1">reuse on a later request</text>
<rect x="60" y="854" width="1480" height="210" rx="7" fill="#151922" stroke="#3b4452" stroke-width="1.3"/>
<text x="86" y="898" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#f2f3f5">The XP pool uses the same lifecycle idea through a separate implementation.</text>
<text x="86" y="953" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#f05a93">XPPickupPool : BasePool&lt;XPPickup&gt;</text>
<path d="M670 945 L760 945" fill="none" stroke="#f05a93" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#pink)"/>
<text x="785" y="953" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#f2f3f5">PrepareForSpawn(value) → activate</text>
<text x="86" y="1004" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#b9c1cd">PoolLink routes returns to the owning generic pool. Preparing value while inactive avoids showing a gem’s previous</text>
<text x="86" y="1038" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#b9c1cd">value.</text>
<path d="M60 1128 L1540 1128" fill="none" stroke="#3b4452" stroke-width="1" stroke-linejoin="round"/>
<text x="60" y="1156" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#b9c1cd">Code: EnemyPool.SpawnEnemy / GetFromPool / Despawn; BasePool&lt;T&gt;; PoolLink; XPPickupPool.SpawnPrepared.</text>
<text x="60" y="1184" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#b9c1cd">EnemyPool owns its own stacks. Runtime growth and fallback behavior vary by pool and caller; this is not a zero-allocation claim.</text></svg>
